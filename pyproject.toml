[project]
name = "somnia"
version = "0.1.0.dev0"
description = "Somnia: durable offline learning cycles for a frozen-model agent (foundation, mock-only)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
]

[project.scripts]
somnia = "somnia.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
